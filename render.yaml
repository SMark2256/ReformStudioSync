services:
  - type: web
    name: reform-studio-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build:shared && npm --workspace=@reform/api run prisma:generate && npm --workspace=@reform/api run build
    startCommand: npm --workspace=@reform/api run prisma:deploy && npm --workspace=@reform/api run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # NODE_ENV=production mellett az npm kihagyná a devDependencies-t (nest CLI, typescript).
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Belépőkód levél (TICKET-35). A kulcs nélkül az API production módban el sem indul.
      - key: SENDPULSE_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
