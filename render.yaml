services:
  - type: web
    name: reform-studio-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build:shared && npm --workspace=@reform/api run prisma:generate && npm --workspace=@reform/api run build
    startCommand: npm --workspace=@reform/api run prisma:deploy && npm --workspace=@reform/api run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # NODE_ENV=production mellett az npm kihagyná a devDependencies-t (nest CLI, typescript).
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Belépőkód levél (TICKET-35). A kulcs nélkül az API production módban el sem indul.
      - key: SENDPULSE_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # Kimenő levélsor (TICKET-55): óránkénti korlát (alapból 10, a SendPulse teszt csomaghoz) és
      # a webapp nyilvános címe a leiratkozó linkhez (alapból a CORS_ORIGIN első címe).
      - key: MAIL_HOURLY_LIMIT
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      # Dokumentumtárolás (TICKET-56, Supabase Storage, privát bucket). Nélküle productionben a
      # vendégfelvétel PDF-mentése „tárolás nincs beállítva” hibát ad (újrapróbálható).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
